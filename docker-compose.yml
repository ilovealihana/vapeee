version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vapebot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vapebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vapebot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vapebot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vapebot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vapebot_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: vapebot_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vapebot}:${POSTGRES_PASSWORD:-vapebot_secret}@postgres:5432/${POSTGRES_DB:-vapebot}
      REDIS_URL: redis://redis:6379/0

volumes:
  postgres_data:
  redis_data:
